properties:
  managedEnvironmentId: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.App/managedEnvironments/<ENVIRONMENT_NAME>
  configuration:
    ingress:
      external: true
      targetPort: 3001
      transport: auto
      allowInsecure: false
  template:
    containers:
      - name: habitflow-pro
        image: <ACR_NAME>.azurecr.io/habitflow-pro:latest
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: NODE_ENV
            value: production
          - name: PORT
            value: "3001"
        probes:
          - type: Liveness
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 15
    scale:
      minReplicas: 1
      maxReplicas: 5
