apiVersion: apps/v1
kind: Deployment
metadata:
  name: habitflow-pro
  labels:
    app: habitflow-pro
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: habitflow-pro
  template:
    metadata:
      labels:
        app: habitflow-pro
    spec:
      containers:
        - name: habitflow-pro
          image: habitflow-pro:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: habitflow-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
