apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habitflow-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - habitflow.example.com
      secretName: habitflow-tls-cert
  rules:
    - host: habitflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: habitflow-service
                port:
                  number: 80
